services:
  db:
    image: postgres:16-alpine
    container_name: pdf-academy-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdf_courses}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pdf_courses}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf_academy

  backend:
    build:
      context: ./backend
    container_name: pdf-academy-backend
    environment:
      APP_NAME: ${APP_NAME:-Mianatra PDF Academy}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pdf_courses}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      UPLOAD_DIR: /app/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pdf_academy

  frontend:
    build:
      context: ./frontend
    container_name: pdf-academy-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - pdf_academy

volumes:
  postgres_data:
  uploads_data:

networks:
  pdf_academy:
    driver: bridge
