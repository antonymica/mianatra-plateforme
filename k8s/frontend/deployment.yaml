apiVersion: apps/v1
kind: Deployment
metadata:
  name: mianatra-frontend
  labels:
    app.kubernetes.io/name: mianatra-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mianatra-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mianatra-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: aanton0/mianatra-plateforme-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: mianatra-config
                  key: VITE_API_URL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
