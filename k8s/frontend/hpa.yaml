apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mianatra-frontend
  labels:
    app.kubernetes.io/name: mianatra-frontend
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mianatra-frontend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
